[package]
name = "rockslop"
version = "0.1.0"
edition = "2021"
description = "xX ROCKSLOP FLASHER Xx - an over-the-top Rockbox installer for the YP3 and TS17"
license = "GPL-2.0-or-later"
default-run = "rockslop"

[[bin]]
name = "rockslop"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }
rusb = { version = "0.9.4", features = ["vendored"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
crc32fast = "1.5.4"
cpal = "0.16"
xmrs = { version = "0.15", default-features = false, features = ["std", "import"] }
xmrsplayer = { version = "0.15", default-features = false, features = ["std"] }
rustybuzz = "0.20"
ab_glyph_rasterizer = "0.1"
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data", "std"] }
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Pixels need speed even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# miniquad 0.4.11 with its X11 drag-and-drop fixed (accepts text/uri-list,
# decodes file:// URIs, sends XdndFinished), its window sized in points on
# high-DPI X11 and Windows, and one MSAA resolve a frame instead of one per
# draw call; see vendor/miniquad/PATCHES.md
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
